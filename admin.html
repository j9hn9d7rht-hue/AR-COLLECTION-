<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR COLLECTION | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;background:#0d0d0d}
.logo{color:#d4af37;font-weight:900;letter-spacing:3px;font-size:20px}
button{cursor:pointer}
.logout{padding:10px 16px;border:1px solid #d4af37;background:none;color:#d4af37;border-radius:6px}
main{max-width:1050px;margin:auto;padding:30px 18px 60px}
.box{background:#111;border:1px solid #292929;border-radius:12px;padding:25px}
.login{max-width:450px;margin:70px auto}
h1,h2{color:#d4af37}
label{display:block;margin:16px 0 7px}
input,textarea{width:100%;padding:13px;background:#080808;color:#fff;border:1px solid #333;border-radius:6px;font-size:15px}
textarea{min-height:100px;resize:vertical}
.primary{width:100%;padding:14px;margin-top:18px;background:#d4af37;color:#000;border:0;border-radius:6px;font-weight:bold}
.msg{margin-top:15px;padding:12px;border-radius:6px;display:none}
.error{display:block;background:#301010;color:#ffaaaa}
.success{display:block;background:#102817;color:#9ee8b6}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.full{grid-column:1/-1}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:25px}
.product{background:#090909;border:1px solid #292929;border-radius:10px;overflow:hidden}
.product img{width:100%;height:230px;object-fit:cover}
.info{padding:16px}
.price{color:#f4d878;font-size:19px;font-weight:bold;margin:10px 0}
.actions{display:flex;gap:8px;margin-top:15px}
.edit,.delete{flex:1;padding:10px;border-radius:5px;background:none;font-weight:bold}
.edit{border:1px solid #d4af37;color:#d4af37}
.delete{border:1px solid #e05252;color:#ff7777}
.cancel{width:100%;padding:12px;margin-top:10px;background:none;color:#aaa;border:1px solid #555;border-radius:6px}
.empty{text-align:center;color:#888;padding:35px;border:1px dashed #444;border-radius:8px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>

<header>
<div class="logo">AR COLLECTION</div>
<button id="logout" class="logout hidden">LOGOUT</button>
</header>

<main>

<!-- LOGIN -->
<section id="login" class="box login">
<h1>ADMIN LOGIN</h1>

<label>Email</label>
<input id="email" type="email" placeholder="Admin email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button id="loginBtn" class="primary">LOGIN</button>

<div id="loginMsg" class="msg"></div>
</section>


<!-- ADMIN PANEL -->
<section id="panel" class="hidden">

<div class="box">
<h1>AR COLLECTION ADMIN</h1>

<form id="form">

<div class="grid">

<div>
<label>Product Name</label>
<input id="name" required placeholder="Premium Black Shirt">
</div>

<div>
<label>Price (PKR)</label>
<input id="price" type="number" min="0" required placeholder="2999">
</div>

<div>
<label>Stock</label>
<input id="stock" type="number" min="0" required placeholder="10">
</div>

<div>
<label>Product Image</label>
<input id="image" type="file" accept="image/*">
</div>

<div class="full">
<label>Description</label>
<textarea id="description" placeholder="Product details"></textarea>
</div>

</div>

<button id="save" class="primary" type="submit">ADD PRODUCT</button>
<button id="cancel" class="cancel hidden" type="button">CANCEL EDIT</button>

<div id="formMsg" class="msg"></div>

</form>
</div>


<div class="box" style="margin-top:25px">
<h2>Your Products</h2>
<div id="products" class="products">
<div class="empty">Loading...</div>
</div>
</div>

</section>

</main>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://zlbezexsphxoqaldmbyg.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsYmV6ZXhzcGh4b3FhbGRtYnlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTYwNjYsImV4cCI6MjEwNDQzMjA2Nn0.FNMbidwkf4sO4HHDrlLBAsoADZaIwyZxTmMTDy2J5xc";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =========================
   ELEMENTS
========================= */

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const logout = document.getElementById("logout");

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const loginMsg = document.getElementById("loginMsg");

const form = document.getElementById("form");
const nameInput = document.getElementById("name");
const priceInput = document.getElementById("price");
const stockInput = document.getElementById("stock");
const descriptionInput = document.getElementById("description");
const imageInput = document.getElementById("image");

const save = document.getElementById("save");
const cancel = document.getElementById("cancel");
const formMsg = document.getElementById("formMsg");
const products = document.getElementById("products");

let editing = null;


/* =========================
   MESSAGE
========================= */

function message(el,text,type){

el.textContent = text;
el.className = "msg " + type;

}


/* =========================
   LOGIN
========================= */

async function start(){

const {data} = await db.auth.getSession();

if(data.session){

showPanel();

}else{

showLogin();

}

}


function showLogin(){

login.classList.remove("hidden");
panel.classList.add("hidden");
logout.classList.add("hidden");

}


function showPanel(){

login.classList.add("hidden");
panel.classList.remove("hidden");
logout.classList.remove("hidden");

loadProducts();

}


loginBtn.onclick = async ()=>{

loginMsg.className="msg";

const e = email.value.trim();
const p = password.value;

if(!e || !p){

message(
loginMsg,
"Email aur password enter karo.",
"error"
);

return;

}

loginBtn.disabled=true;
loginBtn.textContent="LOGIN...";

const {data,error} =
await db.auth.signInWithPassword({
email:e,
password:p
});

loginBtn.disabled=false;
loginBtn.textContent="LOGIN";

if(error){

message(
loginMsg,
"Login failed: " + error.message,
"error"
);

return;

}

if(data.session){

showPanel();

}

};


logout.onclick = async ()=>{

await db.auth.signOut();

editing=null;
form.reset();

showLogin();

};


/* =========================
   IMAGE UPLOAD
========================= */

async function uploadImage(file,userId){

if(!file) return "";

const ext =
file.name.includes(".")
? file.name.split(".").pop().toLowerCase()
: "jpg";

const path =
userId + "/" +
Date.now() + "-" +
Math.random().toString(36).slice(2) +
"." + ext;

const {error} =
await db.storage
.from("products")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);

if(error) throw error;

const {data} =
db.storage
.from("products")
.getPublicUrl(path);

return data.publicUrl;

}


/* =========================
   ADD / EDIT
========================= */

form.onsubmit = async e=>{

e.preventDefault();

formMsg.className="msg";

const {data:userData} =
await db.auth.getUser();

const user=userData.user;

if(!user){

showLogin();
return;

}

save.disabled=true;
save.textContent =
editing ? "UPDATING..." : "ADDING...";

try{

let imageUrl =
editing ? editing.image_url || "" : "";

const file=imageInput.files[0];

if(file){

imageUrl=await uploadImage(
file,
user.id
);

}

const product={

name:nameInput.value.trim(),

price:Number(priceInput.value),

stock:Number(stockInput.value),

description:descriptionInput.value.trim(),

image_url:imageUrl

};


if(editing){

const {error} =
await db
.from("products")
.update(product)
.eq("id",editing.id);

if(error) throw error;

message(
formMsg,
"Product successfully updated.",
"success"
);

}else{

const {error} =
await db
.from("products")
.insert(product);

if(error) throw error;

message(
formMsg,
"Product successfully added.",
"success"
);

}

resetForm();
loadProducts();

}catch(error){

message(
formMsg,
error.message,
"error"
);

}

save.disabled=false;
save.textContent =
editing ? "UPDATE PRODUCT" : "ADD PRODUCT";

};


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

products.innerHTML =
'<div class="empty">Loading products...</div>';

const {data,error} =
await db
.from("products")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

products.innerHTML =
'<div class="empty">Products load nahi ho rahe.<br><br>'+
escapeHTML(error.message)+
'</div>';

return;

}

if(!data || data.length===0){

products.innerHTML =
'<div class="empty">'+
'Abhi koi product nahi hai.<br>'+
'Apna first product add karo.'+
'</div>';

return;

}

products.innerHTML =
data.map(p=>`

<div class="product">

${
p.image_url
? `<img src="${escapeHTML(p.image_url)}" alt="${escapeHTML(p.name)}">`
: `<div style="height:230px;display:flex;align-items:center;justify-content:center;color:#777">
AR COLLECTION
</div>`
}

<div class="info">

<h3>${escapeHTML(p.name)}</h3>

<div class="price">
Rs. ${escapeHTML(p.price)}
</div>

<div style="color:#999">
Stock: ${escapeHTML(p.stock)}
</div>

<p style="color:#888">
${escapeHTML(p.description || "")}
</p>

<div class="actions">

<button
class="edit"
onclick="editProduct('${p.id}')">
EDIT
</button>

<button
class="delete"
onclick="deleteProduct('${p.id}')">
DELETE
</button>

</div>

</div>
</div>

`).join("");

}


/* =========================
   EDIT
========================= */

window.editProduct = async id=>{

const {data,error} =
await db
.from("products")
.select("*")
.eq("id",id)
.single();

if(error){

alert(error.message);
return;

}

editing=data;

nameInput.value=data.name || "";
priceInput.value=data.price ?? "";
stockInput.value=data.stock ?? "";
descriptionInput.value=data.description || "";
imageInput.value="";

save.textContent="UPDATE PRODUCT";
cancel.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* =========================
   CANCEL
========================= */

cancel.onclick=()=>{

resetForm();

};


function resetForm(){

editing=null;

form.reset();

save.textContent="ADD PRODUCT";

cancel.classList.add("hidden");

}


/* =========================
   DELETE
========================= */

window.deleteProduct = async id=>{

const ok=confirm(
"Kya tum ye product delete karna chahte ho?"
);

if(!ok) return;

const {error} =
await db
.from("products")
.delete()
.eq("id",id);

if(error){

alert(
"Delete failed: " +
error.message
);

return;

}

loadProducts();

};


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   AUTH LISTENER
========================= */

db.auth.onAuthStateChange(
(event,session)=>{

if(session){

showPanel();

}else{

showLogin();

}

});


start();

</script>

</body>
</html>
