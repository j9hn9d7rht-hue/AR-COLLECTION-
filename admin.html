<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Collection - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 4px;
      color: #d4af37;
    }

    .logo p {
      margin-top: 10px;
      font-size: 18px;
      letter-spacing: 2px;
      color: #aaa;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      color: #d4af37;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #ddd;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #080808;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #d4af37;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      padding: 13px 20px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      margin-top: 10px;
      margin-right: 6px;
    }

    .gold {
      background: #d4af37;
      color: #000;
    }

    .dark {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }

    .danger {
      background: #b91c1c;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 13px;
      border-radius: 9px;
      margin-top: 15px;
      background: #191919;
      border: 1px solid #333;
      color: #fff;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .product {
      background: #080808;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .no-image {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      background: #151515;
    }

    .product-content {
      padding: 16px;
    }

    .product h3 {
      margin: 0 0 8px;
      color: #d4af37;
      font-size: 20px;
    }

    .product-description {
      color: #bbb;
      line-height: 1.5;
    }

    .price {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .stock {
      margin-top: 7px;
      color: #999;
    }

    .preview {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 12px;
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .logo h1 {
        font-size: 27px;
      }

      .card {
        padding: 20px;
      }

      .product img,
      .no-image {
        height: 210px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="logo">
    <h1>AR COLLECTION</h1>
    <p>ADMIN PANEL</p>
  </div>


  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h2>ADMIN LOGIN</h2>

    <label>Admin Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter admin email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button class="gold" onclick="login()">
      LOGIN
    </button>

    <div id="loginMessage" class="message hidden"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">

    <!-- TOP -->
    <div class="card">

      <div class="topbar">

        <div>
          <h2>AR Collection Admin</h2>
          <p style="color:#999;">
            Manage your products here.
          </p>
        </div>

        <button class="danger" onclick="logout()">
          LOGOUT
        </button>

      </div>

    </div>


    <!-- PRODUCT FORM -->
    <div class="card">

      <h2 id="formTitle">
        Add Product
      </h2>

      <label>Product Name</label>

      <input
        id="productName"
        type="text"
        placeholder="Example: Premium Black Shirt"
      >

      <label>Description</label>

      <textarea
        id="productDescription"
        placeholder="Product description"
      ></textarea>

      <label>Price</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="Example: 2999"
      >

      <label>Stock</label>

      <input
        id="productStock"
        type="number"
        min="0"
        step="1"
        placeholder="Example: 20"
      >

      <label>Product Image</label>

      <input
        id="productImage"
        type="file"
        accept="image/*"
        onchange="previewImage(event)"
      >

      <img
        id="imagePreview"
        class="preview"
        alt="Image Preview"
      >

      <br>

      <button
        class="gold"
        onclick="saveProduct()"
      >
        SAVE PRODUCT
      </button>

      <button
        id="cancelButton"
        class="dark hidden"
        onclick="cancelEdit()"
      >
        CANCEL
      </button>

      <div
        id="productMessage"
        class="message hidden"
      ></div>

    </div>


    <!-- PRODUCTS -->
    <div class="card">

      <div class="topbar">

        <h2>
          All Products
        </h2>

        <button
          class="dark"
          onclick="loadProducts()"
        >
          REFRESH
        </button>

      </div>

      <div
        id="products"
        class="products"
      ></div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://zlbezexsphxoqaldmbyg.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsYmV6ZXhzcGh4b3FhbGRtYnlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NTYwNjYsImV4cCI6MjEwNDQzMjA2Nn0.FNMbidwkf4sO4HHDrlLBAsoADZaIwyZxTmMTDy2J5xc";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let editingProductId = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  elementId,
  text,
  error = false
) {

  const box =
    document.getElementById(elementId);

  box.textContent = text;

  box.classList.remove("hidden");

  if (error) {
    box.style.color = "#ff8b8b";
  } else {
    box.style.color = "#8ee28e";
  }
}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Email aur password enter karo.",
      true
    );

    return;
  }

  showMessage(
    "loginMessage",
    "Login ho raha hai..."
  );


  try {

    /*
      Direct Supabase Auth request.
      Is se API key clearly request header
      mein send hoti hai.
    */

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.msg ||
        result.message ||
        result.error_description ||
        "Login failed."
      );
    }


    if (
      !result.access_token ||
      !result.refresh_token
    ) {

      throw new Error(
        "Supabase session nahi mili."
      );
    }


    /*
      Login session save
    */

    const sessionResult =
      await db.auth.setSession({
        access_token:
          result.access_token,

        refresh_token:
          result.refresh_token
      });


    if (sessionResult.error) {
      throw sessionResult.error;
    }


    /*
      Check admin
    */

    const adminCheck =
      await db.rpc("is_admin");


    if (adminCheck.error) {
      throw adminCheck.error;
    }


    if (adminCheck.data !== true) {

      await db.auth.signOut();

      throw new Error(
        "Ye account admin nahi hai."
      );
    }


    /*
      Show admin panel
    */

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    await loadProducts();

  }

  catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );

    showMessage(
      "loginMessage",
      error.message ||
      "Login failed.",
      true
    );
  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  await db.auth.signOut();

  document
    .getElementById("adminPanel")
    .classList.add("hidden");

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("password")
    .value = "";

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession() {

  try {

    const session =
      await db.auth.getSession();


    if (session.error) {
      console.error(session.error);
      return;
    }


    if (!session.data.session) {
      return;
    }


    const adminCheck =
      await db.rpc("is_admin");


    if (
      adminCheck.error ||
      adminCheck.data !== true
    ) {

      await db.auth.signOut();

      return;
    }


    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    await loadProducts();

  }

  catch (error) {

    console.error(
      "SESSION ERROR:",
      error
    );

  }

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

  const productsBox =
    document.getElementById("products");


  productsBox.innerHTML =
    "<p style='color:#aaa;'>Loading products...</p>";


  const result =
    await db
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (result.error) {

    console.error(
      result.error
    );

    productsBox.innerHTML =
      "<p style='color:#ff7777;'>" +
      "Products load nahi ho rahe: " +
      escapeHtml(
        result.error.message
      ) +
      "</p>";

    return;
  }


  const products =
    result.data || [];


  if (products.length === 0) {

    productsBox.innerHTML =
      "<p style='color:#aaa;'>" +
      "Abhi koi product nahi hai." +
      "</p>";

    return;
  }


  productsBox.innerHTML = "";


  products.forEach(
    function(product) {

      const card =
        document.createElement("div");

      card.className =
        "product";


      let imageHTML =
        '<div class="no-image">No Image</div>';


      if (product.image_url) {

        imageHTML =
          '<img src="' +
          escapeHtml(
            product.image_url
          ) +
          '" alt="Product">';
      }


      card.innerHTML =

        imageHTML +

        '<div class="product-content">' +

        '<h3>' +
        escapeHtml(
          product.name
        ) +
        '</h3>' +

        '<div class="product-description">' +
        escapeHtml(
          product.description || ""
        ) +
        '</div>' +

        '<div class="price">' +
        'Rs. ' +
        Number(
          product.price || 0
        ).toLocaleString() +
        '</div>' +

        '<div class="stock">' +
        'Stock: ' +
        Number(
          product.stock || 0
        ) +
        '</div>' +

        '<button class="gold">' +
        'Edit' +
        '</button>' +

        '<button class="danger">' +
        'Delete' +
        '</button>' +

        '</div>';


      const buttons =
        card.querySelectorAll(
          "button"
        );


      buttons[0].onclick =
        function() {
          editProduct(product);
        };


      buttons[1].onclick =
        function() {
          deleteProduct(
            product.id
          );
        };


      productsBox.appendChild(card);

    }
  );

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const stock =
    Number(
      document
        .getElementById("productStock")
        .value
    );


  const imageFile =
    document
      .getElementById("productImage")
      .files[0];


  if (!name) {

    showMessage(
      "productMessage",
      "Product name enter karo.",
      true
    );

    return;
  }


  if (
    Number.isNaN(price) ||
    price < 0
  ) {

    showMessage(
      "productMessage",
      "Valid price enter karo.",
      true
    );

    return;
  }


  if (
    Number.isNaN(stock) ||
    stock < 0
  ) {

    showMessage(
      "productMessage",
      "Valid stock enter karo.",
      true
    );

    return;
  }


  showMessage(
    "productMessage",
    "Product save ho raha hai..."
  );


  try {

    let imageUrl = "";


    /*
      Upload image if selected
    */

    if (imageFile) {

      const extension =
        imageFile.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const upload =
        await db.storage
          .from("products")
          .upload(
            fileName,
            imageFile,
            {
              cacheControl: "3600",
              upsert: false,
              contentType:
                imageFile.type
            }
          );


      if (upload.error) {
        throw upload.error;
      }


      const publicUrl =
        db.storage
          .from("products")
          .getPublicUrl(
            fileName
          );


      imageUrl =
        publicUrl.data.publicUrl;

    }


    /*
      EDIT
    */

    if (editingProductId) {

      const updateData = {

        name: name,

        description:
          description,

        price: price,

        stock: stock

      };


      if (imageUrl) {

        updateData.image_url =
          imageUrl;

      }


      const update =
        await db
          .from("products")
          .update(updateData)
          .eq(
            "id",
            editingProductId
          );


      if (update.error) {
        throw update.error;
      }


      showMessage(
        "productMessage",
        "Product successfully update ho gaya."
      );

    }


    /*
      ADD
    */

    else {

      const insert =
        await db
          .from("products")
          .insert({

            name: name,

            description:
              description,

            price: price,

            stock: stock,

            image_url:
              imageUrl

          });


      if (insert.error) {
        throw insert.error;
      }


      showMessage(
        "productMessage",
        "Product successfully add ho gaya."
      );

    }


    clearForm();

    await loadProducts();

  }

  catch (error) {

    console.error(
      "PRODUCT ERROR:",
      error
    );

    showMessage(
      "productMessage",
      error.message ||
      "Product save nahi hua.",
      true
    );

  }

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(product) {

  editingProductId =
    product.id;


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Product";


  document
    .getElementById("productName")
    .value =
    product.name || "";


  document
    .getElementById("productDescription")
    .value =
    product.description || "";


  document
    .getElementById("productPrice")
    .value =
    product.price || 0;


  document
    .getElementById("productStock")
    .value =
    product.stock || 0;


  document
    .getElementById("cancelButton")
    .classList.remove(
      "hidden"
    );


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

  clearForm();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  editingProductId = null;


  document
    .getElementById("formTitle")
    .textContent =
    "Add Product";


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productStock")
    .value = "";


  document
    .getElementById("productImage")
    .value = "";


  const preview =
    document.getElementById(
      "imagePreview"
    );


  preview.src = "";

  preview.style.display =
    "none";


  document
    .getElementById("cancelButton")
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id) {

  const confirmDelete =
    confirm(
      "Kya aap ye product delete karna chahte hain?"
    );


  if (!confirmDelete) {
    return;
  }


  try {

    const result =
      await db
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


    if (result.error) {
      throw result.error;
    }


    showMessage(
      "productMessage",
      "Product delete ho gaya."
    );


    await loadProducts();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "productMessage",
      error.message ||
      "Product delete nahi hua.",
      true
    );

  }

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(event) {

  const file =
    event.target.files[0];


  const preview =
    document.getElementById(
      "imagePreview"
    );


  if (!file) {

    preview.src = "";

    preview.style.display =
      "none";

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      preview.src =
        event.target.result;

      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

checkSession();

</script>

</body>
</html>
