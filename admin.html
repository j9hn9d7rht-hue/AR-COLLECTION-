<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Collection - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#050505;
  color:#fff;
  min-height:100vh;
}

.gold{
  color:#d4af37;
}

.container{
  width:92%;
  max-width:1100px;
  margin:auto;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:35px 25px;
  box-shadow:0 0 30px rgba(212,175,55,.12);
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  object-fit:contain;
  margin-bottom:15px;
}

.login-box h1{
  color:#d4af37;
  margin-bottom:8px;
}

.login-box p{
  color:#aaa;
  margin-bottom:25px;
}

input, textarea, select{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  background:#080808;
  color:#fff;
  border:1px solid #444;
  border-radius:9px;
  outline:none;
}

input:focus, textarea:focus, select:focus{
  border-color:#d4af37;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  cursor:pointer;
  border:none;
  border-radius:9px;
  padding:13px 20px;
  font-weight:bold;
}

.gold-btn{
  width:100%;
  background:#d4af37;
  color:#000;
  margin-top:5px;
}

.gold-btn:hover{
  background:#f0d060;
}

.message{
  margin-top:15px;
  color:#ff7777;
}

/* ADMIN */
#adminPage{
  display:none;
  padding-bottom:50px;
}

header{
  background:#0c0c0c;
  border-bottom:1px solid #292929;
  padding:15px 0;
  margin-bottom:30px;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.header-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.header-brand img{
  width:55px;
  height:55px;
  object-fit:contain;
}

.header-brand h2{
  color:#d4af37;
}

.logout{
  background:#222;
  color:#fff;
  border:1px solid #555;
}

.logout:hover{
  border-color:#d4af37;
  color:#d4af37;
}

.panel{
  background:#101010;
  border:1px solid #2b2b2b;
  border-radius:16px;
  padding:25px;
  margin-bottom:25px;
}

.panel h2{
  color:#d4af37;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#ccc;
  font-size:14px;
}

.size-box{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.size-option{
  position:relative;
}

.size-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.size-option label{
  display:block;
  padding:10px 16px;
  border:1px solid #555;
  border-radius:8px;
  cursor:pointer;
  color:#ddd;
  margin:0;
}

.size-option input:checked + label{
  background:#d4af37;
  color:#000;
  border-color:#d4af37;
  font-weight:bold;
}

.image-preview{
  display:none;
  width:150px;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #555;
  margin:10px 0 20px;
}

.form-buttons{
  display:flex;
  gap:10px;
}

.save-btn{
  background:#d4af37;
  color:#000;
  flex:1;
}

.cancel-btn{
  background:#292929;
  color:#fff;
  flex:1;
}

.products-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  gap:10px;
}

.refresh-btn{
  background:#222;
  color:#d4af37;
  border:1px solid #555;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.product{
  background:#080808;
  border:1px solid #292929;
  border-radius:14px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:#151515;
}

.product-content{
  padding:17px;
}

.product h3{
  color:#d4af37;
  margin-bottom:8px;
}

.product p{
  color:#aaa;
  margin-bottom:8px;
  line-height:1.5;
}

.price{
  color:#fff !important;
  font-weight:bold;
}

.stock{
  color:#bbb !important;
}

.sizes{
  color:#d4af37 !important;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.edit-btn{
  flex:1;
  background:#222;
  color:#d4af37;
  border:1px solid #555;
}

.delete-btn{
  flex:1;
  background:#5b1111;
  color:#fff;
}

.empty{
  color:#888;
  text-align:center;
  padding:30px;
}

@media(max-width:600px){
  .panel{
    padding:18px;
  }

  .header-brand h2{
    font-size:18px;
  }

  .products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">

  <div class="login-box">

    <img src="logo.png" class="logo" alt="AR Collection">

    <h1>AR COLLECTION</h1>
    <p>Admin Panel</p>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="gold-btn" onclick="login()">
      LOGIN
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<!-- ADMIN PAGE -->
<div id="adminPage">

<header>
  <div class="container header-inner">

    <div class="header-brand">
      <img src="logo.png" alt="AR Collection">
      <h2>AR COLLECTION ADMIN</h2>
    </div>

    <button class="logout" onclick="logout()">
      LOGOUT
    </button>

  </div>
</header>


<div class="container">

<!-- ADD / EDIT PRODUCT -->
<div class="panel">

  <h2 id="formTitle">Add Product</h2>

  <input type="hidden" id="productId">

  <label>Product Name</label>
  <input
    type="text"
    id="productName"
    placeholder="Example: Premium Black Shirt"
  >

  <label>Description</label>
  <textarea
    id="productDescription"
    placeholder="Product description"
  ></textarea>

  <label>Price</label>
  <input
    type="number"
    id="productPrice"
    placeholder="2999"
    min="0"
  >

  <label>Stock</label>
  <input
    type="number"
    id="productStock"
    placeholder="10"
    min="0"
  >

  <label>Select Sizes</label>

  <div class="size-box">

    <div class="size-option">
      <input type="checkbox" id="sizeS" value="S">
      <label for="sizeS">S</label>
    </div>

    <div class="size-option">
      <input type="checkbox" id="sizeM" value="M">
      <label for="sizeM">M</label>
    </div>

    <div class="size-option">
      <input type="checkbox" id="sizeL" value="L">
      <label for="sizeL">L</label>
    </div>

    <div class="size-option">
      <input type="checkbox" id="sizeXL" value="XL">
      <label for="sizeXL">XL</label>
    </div>

    <div class="size-option">
      <input type="checkbox" id="sizeXXL" value="XXL">
      <label for="sizeXXL">XXL</label>
    </div>

    <div class="size-option">
      <input type="checkbox" id="size3XL" value="3XL">
      <label for="size3XL">3XL</label>
    </div>

  </div>

  <label>Product Image</label>

  <input
    type="file"
    id="productImage"
    accept="image/*"
    onchange="previewImage(event)"
  >

  <img id="imagePreview" class="image-preview" alt="Preview">

  <div class="form-buttons">

    <button class="save-btn" onclick="saveProduct()">
      SAVE PRODUCT
    </button>

    <button class="cancel-btn" onclick="resetForm()">
      CANCEL
    </button>

  </div>

  <div id="formMessage" class="message"></div>

</div>


<!-- PRODUCTS -->
<div class="panel">

  <div class="products-header">

    <h2>All Products</h2>

    <button class="refresh-btn" onclick="loadProducts()">
      REFRESH
    </button>

  </div>

  <div id="products" class="products">
    <div class="empty">Loading products...</div>
  </div>

</div>

</div>
</div>


<script>

const SUPABASE_URL =
"https://zlbezexsphxoqaldmbyg.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IjpsYmV6ZXNwaHhvcWFsZG1ieWciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODg1NjA2NiwiZXhwIjoyMTA0NDMyMDY2fQ.FNMbidwkf4sO4HHDrlLBAsoADZaIwyZxTmMTDy2J5xc";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* LOGIN */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if(!email || !password){
    message.textContent =
      "Email aur password enter karo.";
    return;
  }

  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    message.textContent =
      error.message;

    return;
  }

  if(data.session){

    document.getElementById("loginPage").style.display =
      "none";

    document.getElementById("adminPage").style.display =
      "block";

    await loadProducts();
  }
}


/* LOGOUT */

async function logout(){

  await db.auth.signOut();

  document.getElementById("adminPage").style.display =
    "none";

  document.getElementById("loginPage").style.display =
    "flex";

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";
}


/* SESSION CHECK */

async function checkSession(){

  const { data } =
    await db.auth.getSession();

  if(data.session){

    document.getElementById("loginPage").style.display =
      "none";

    document.getElementById("adminPage").style.display =
      "block";

    await loadProducts();

  }else{

    document.getElementById("loginPage").style.display =
      "flex";

    document.getElementById("adminPage").style.display =
      "none";
  }
}


/* IMAGE PREVIEW */

function previewImage(event){

  const file =
    event.target.files[0];

  const preview =
    document.getElementById("imagePreview");

  if(!file){

    preview.style.display = "none";
    preview.src = "";
    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";
}


/* GET SIZES */

function getSelectedSizes(){

  const sizes = [];

  document
    .querySelectorAll(".size-option input:checked")
    .forEach(input => {
      sizes.push(input.value);
    });

  return sizes;
}


/* SET SIZES */

function setSelectedSizes(sizes){

  const all =
    document.querySelectorAll(
      ".size-option input"
    );

  all.forEach(input => {

    input.checked =
      sizes.includes(input.value);

  });
}


/* SAVE PRODUCT */

async function saveProduct(){

  const message =
    document.getElementById("formMessage");

  message.textContent = "";

  const productId =
    document.getElementById("productId").value;

  const name =
    document.getElementById("productName").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();

  const price =
    Number(document.getElementById("productPrice").value);

  const stock =
    Number(document.getElementById("productStock").value);

  const sizes =
    getSelectedSizes();

  const imageFile =
    document.getElementById("productImage").files[0];

  if(!name){

    message.textContent =
      "Product name enter karo.";

    return;
  }

  if(!price || price < 0){

    message.textContent =
      "Valid price enter karo.";

    return;
  }

  if(stock < 0 || isNaN(stock)){

    message.textContent =
      "Valid stock enter karo.";

    return;
  }

  let imageUrl = null;


  /* EDIT: existing image */

  if(productId){

    const { data: oldProduct } =
      await db
        .from("products")
        .select("image_url")
        .eq("id", productId)
        .single();

    if(oldProduct){
      imageUrl =
        oldProduct.image_url || null;
    }
  }


  /* UPLOAD NEW IMAGE */

  if(imageFile){

    const extension =
      imageFile.name.split(".").pop();

    const fileName =
      "product-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;

    const filePath =
      fileName;

    const { error: uploadError } =
      await db.storage
        .from("products")
        .upload(
          filePath,
          imageFile,
          {
            cacheControl:"3600",
            upsert:false
          }
        );

    if(uploadError){

      message.textContent =
        "Image upload error: " +
        uploadError.message;

      return;
    }

    const { data: publicData } =
      db.storage
        .from("products")
        .getPublicUrl(filePath);

    imageUrl =
      publicData.publicUrl;
  }


  const productData = {

    name: name,

    description:
      description || null,

    price: price,

    stock: stock,

    sizes: sizes,

    image_url: imageUrl
  };


  /* UPDATE */

  if(productId){

    const { error } =
      await db
        .from("products")
        .update(productData)
        .eq("id", productId);

    if(error){

      message.textContent =
        error.message;

      return;
    }

    message.style.color = "#d4af37";
    message.textContent =
      "Product updated successfully.";

  }


  /* INSERT */

  else{

    const { error } =
      await db
        .from("products")
        .insert(productData);

    if(error){

      message.textContent =
        error.message;

      return;
    }

    message.style.color = "#d4af37";
    message.textContent =
      "Product saved successfully.";
  }


  resetForm();
  await loadProducts();
}


/* LOAD PRODUCTS */

async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML =
    '<div class="empty">Loading products...</div>';

  const { data, error } =
    await db
      .from("products")
      .select(
        "id,name,description,price,stock,image_url,sizes,created_at"
      )
      .order(
        "created_at",
        { ascending:false }
      );

  if(error){

    container.innerHTML =
      '<div class="empty">' +
      error.message +
      '</div>';

    return;
  }

  if(!data || data.length === 0){

    container.innerHTML =
      '<div class="empty">No products found.</div>';

    return;
  }


  container.innerHTML = "";


  data.forEach(product => {

    const card =
      document.createElement("div");

    card.className =
      "product";


    const image =
      product.image_url
      ? `<img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}">`
      : `<div style="height:260px;display:flex;align-items:center;justify-content:center;color:#777;">NO IMAGE</div>`;


    const sizes =
      Array.isArray(product.sizes) &&
      product.sizes.length
      ? product.sizes.join(", ")
      : "Not specified";


    card.innerHTML = `

      ${image}

      <div class="product-content">

        <h3>
          ${escapeHtml(product.name)}
        </h3>

        <p>
          ${escapeHtml(product.description || "")}
        </p>

        <p class="price">
          Price: Rs. ${Number(product.price).toLocaleString()}
        </p>

        <p class="stock">
          Stock: ${product.stock}
        </p>

        <p class="sizes">
          Sizes: ${escapeHtml(sizes)}
        </p>

        <div class="product-actions">

          <button
            class="edit-btn"
            onclick="editProduct('${product.id}')"
          >
            EDIT
          </button>

          <button
            class="delete-btn"
            onclick="deleteProduct('${product.id}')"
          >
            DELETE
          </button>

        </div>

      </div>
    `;


    container.appendChild(card);

  });
}


/* EDIT PRODUCT */

async function editProduct(id){

  const { data: product, error } =
    await db
      .from("products")
      .select("*")
      .eq("id", id)
      .single();

  if(error || !product){

    alert(
      error
      ? error.message
      : "Product not found."
    );

    return;
  }


  document.getElementById("productId").value =
    product.id;

  document.getElementById("productName").value =
    product.name || "";

  document.getElementById("productDescription").value =
    product.description || "";

  document.getElementById("productPrice").value =
    product.price || "";

  document.getElementById("productStock").value =
    product.stock ?? "";


  setSelectedSizes(
    Array.isArray(product.sizes)
    ? product.sizes
    : []
  );


  document.getElementById("formTitle").textContent =
    "Edit Product";


  document.getElementById("formMessage").textContent =
    "";


  const preview =
    document.getElementById("imagePreview");

  if(product.image_url){

    preview.src =
      product.image_url;

    preview.style.display =
      "block";

  }else{

    preview.style.display =
      "none";
  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* DELETE PRODUCT */

async function deleteProduct(id){

  const confirmDelete =
    confirm(
      "Kya aap is product ko delete karna chahte hain?"
    );

  if(!confirmDelete){
    return;
  }


  const { error } =
    await db
      .from("products")
      .delete()
      .eq("id", id);


  if(error){

    alert(error.message);
    return;
  }


  await loadProducts();
}


/* RESET FORM */

function resetForm(){

  document.getElementById("productId").value =
    "";

  document.getElementById("productName").value =
    "";

  document.getElementById("productDescription").value =
    "";

  document.getElementById("productPrice").value =
    "";

  document.getElementById("productStock").value =
    "";

  document.getElementById("productImage").value =
    "";

  document
    .querySelectorAll(".size-option input")
    .forEach(input => {
      input.checked = false;
    });


  document.getElementById("imagePreview").style.display =
    "none";

  document.getElementById("imagePreview").src =
    "";

  document.getElementById("formTitle").textContent =
    "Add Product";

  document.getElementById("formMessage").textContent =
    "";
}


/* HTML ESCAPE */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* START */

checkSession();

</script>

</body>
</html>
