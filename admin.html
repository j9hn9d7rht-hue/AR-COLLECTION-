<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Collection | Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 40px 0;
    }

    h1, h2 {
      color: #d4af37;
      letter-spacing: 2px;
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand h1 {
      font-size: 42px;
      margin: 0 0 8px;
    }

    .brand p {
      color: #aaa;
      margin: 0;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      color: #ddd;
      font-size: 16px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #080808;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #d4af37;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .gold-btn {
      background: #d4af37;
      color: #080808;
      width: 100%;
      margin-top: 22px;
    }

    .gold-btn:hover {
      background: #f0ce55;
    }

    .logout {
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    .logout:hover {
      background: #333;
    }

    .delete {
      background: #8b2222;
      color: white;
    }

    .delete:hover {
      background: #b52d2d;
    }

    .edit {
      background: #d4af37;
      color: #080808;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    .error {
      display: block;
      background: #351010;
      color: #ffaaaa;
      border: 1px solid #652222;
    }

    .success {
      display: block;
      background: #102d18;
      color: #9ff0ae;
      border: 1px solid #235c30;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .topbar h2 {
      margin: 0;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .product {
      background: #0c0c0c;
      border: 1px solid #333;
      border-radius: 15px;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #151515;
      display: block;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      margin: 0 0 8px;
      color: #d4af37;
    }

    .product-info p {
      color: #aaa;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .price {
      color: white !important;
      font-size: 20px;
      font-weight: bold;
    }

    .stock {
      color: #aaa !important;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .actions button {
      flex: 1;
    }

    .preview {
      margin-top: 12px;
      max-width: 180px;
      max-height: 180px;
      border-radius: 10px;
      display: none;
      object-fit: cover;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 35px;
      border: 1px dashed #444;
      border-radius: 15px;
    }

    .login-box {
      max-width: 550px;
      margin: 80px auto;
    }

    .admin-panel {
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding: 25px 0;
      }

      .brand h1 {
        font-size: 32px;
      }

      .card {
        padding: 20px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .logout {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="container login-box">

    <div class="brand">
      <h1>AR COLLECTION</h1>
      <p>ADMIN PANEL</p>
    </div>

    <div class="card">
      <h2>ADMIN LOGIN</h2>

      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter admin email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >

      <button id="loginBtn" class="gold-btn">
        LOGIN
      </button>

      <div id="loginMessage" class="message"></div>
    </div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="container admin-panel">

    <div class="topbar">
      <div>
        <h2>AR COLLECTION</h2>
        <p style="color:#888;margin:5px 0 0;">Online Admin Panel</p>
      </div>

      <button id="logoutBtn" class="logout">
        LOGOUT
      </button>
    </div>


    <!-- ADD / EDIT PRODUCT -->
    <div class="card">

      <h2 id="formTitle">ADD PRODUCT</h2>

      <input type="hidden" id="productId">

      <label for="productName">Product Name</label>
      <input
        id="productName"
        type="text"
        placeholder="Example: Premium Black Shirt"
      >

      <label for="productDescription">Description</label>
      <textarea
        id="productDescription"
        placeholder="Product description..."
      ></textarea>

      <label for="productPrice">Price (PKR)</label>
      <input
        id="productPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="2999"
      >

      <label for="productStock">Stock</label>
      <input
        id="productStock"
        type="number"
        min="0"
        step="1"
        placeholder="10"
      >

      <label for="productImage">Product Image</label>
      <input
        id="productImage"
        type="file"
        accept="image/*"
      >

      <img id="imagePreview" class="preview" alt="Preview">

      <button id="saveProductBtn" class="gold-btn">
        ADD PRODUCT
      </button>

      <button
        id="cancelEditBtn"
        class="logout hidden"
        style="width:100%;margin-top:10px;"
      >
        CANCEL EDIT
      </button>

      <div id="productMessage" class="message"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="card">

      <div class="topbar">
        <div>
          <h2>PRODUCTS</h2>
          <p style="color:#888;margin:5px 0 0;">
            Manage your AR Collection products
          </p>
        </div>

        <button id="refreshBtn" class="logout">
          REFRESH
        </button>
      </div>

      <div id="productsList" class="products">
        <div class="loading">
          Loading products...
        </div>
      </div>

    </div>

  </div>


<script>
  /* =========================================================
     SUPABASE CONFIG
     ========================================================= */

  const SUPABASE_URL = "https://zlbezexsphxoqaldmbyg.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsYmV4ZXNwaHhvcWFsZG1ieWciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODg1NjA2NiwiZXhwIjoyMTA0NDMyMDY2fQ.FNMbidwkf4sO4HHDrlLBAsoADZaIwyZxTmMTDy2J5xc";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const loginScreen = document.getElementById("loginScreen");
  const adminPanel = document.getElementById("adminPanel");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const loginMessage = document.getElementById("loginMessage");

  const productId = document.getElementById("productId");
  const productName = document.getElementById("productName");
  const productDescription =
    document.getElementById("productDescription");
  const productPrice = document.getElementById("productPrice");
  const productStock = document.getElementById("productStock");
  const productImage = document.getElementById("productImage");

  const imagePreview =
    document.getElementById("imagePreview");

  const saveProductBtn =
    document.getElementById("saveProductBtn");

  const cancelEditBtn =
    document.getElementById("cancelEditBtn");

  const productMessage =
    document.getElementById("productMessage");

  const productsList =
    document.getElementById("productsList");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const formTitle =
    document.getElementById("formTitle");


  /* =========================================================
     MESSAGE HELPERS
     ========================================================= */

  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = "message " + type;
  }

  function clearMessage(element) {
    element.textContent = "";
    element.className = "message";
  }


  /* =========================================================
     LOGIN
     ========================================================= */

  loginBtn.addEventListener("click", login);

  passwordInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      login();
    }
  });

  emailInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      login();
    }
  });


  async function login() {

    clearMessage(loginMessage);

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showMessage(
        loginMessage,
        "Please enter email and password.",
        "error"
      );
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "LOGGING IN...";

    try {

      const { data, error } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error("Login failed.");
      }


      /* Check whether logged-in user is an admin */

      const { data: adminData, error: adminError } =
        await db
          .from("admins")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();


      if (adminError) {
        throw adminError;
      }

      if (!adminData) {

        await db.auth.signOut();

        throw new Error(
          "This account is not registered as an admin."
        );
      }


      /* Login successful */

      loginScreen.style.display = "none";
      adminPanel.classList.add("active");

      await loadProducts();

    } catch (error) {

      console.error(error);

      showMessage(
        loginMessage,
        error.message || "Login failed.",
        "error"
      );

    } finally {

      loginBtn.disabled = false;
      loginBtn.textContent = "LOGIN";
    }
  }


  /* =========================================================
     LOGOUT
     ========================================================= */

  logoutBtn.addEventListener("click", async function() {

    await db.auth.signOut();

    adminPanel.classList.remove("active");
    loginScreen.style.display = "block";

    emailInput.value = "";
    passwordInput.value = "";

    clearMessage(loginMessage);

  });


  /* =========================================================
     CHECK EXISTING SESSION
     ========================================================= */

  async function checkSession() {

    try {

      const {
        data: { session }
      } = await db.auth.getSession();

      if (!session) {
        return;
      }

      const { data: adminData, error } =
        await db
          .from("admins")
          .select("user_id")
          .eq("user_id", session.user.id)
          .maybeSingle();

      if (error || !adminData) {

        await db.auth.signOut();
        return;
      }

      loginScreen.style.display = "none";
      adminPanel.classList.add("active");

      await loadProducts();

    } catch (error) {

      console.error(error);
    }
  }


  /* =========================================================
     IMAGE PREVIEW
     ========================================================= */

  productImage.addEventListener("change", function() {

    const file = productImage.files[0];

    if (!file) {
      imagePreview.style.display = "none";
      imagePreview.src = "";
      return;
    }

    const url = URL.createObjectURL(file);

    imagePreview.src = url;
    imagePreview.style.display = "block";
  });


  /* =========================================================
     UPLOAD IMAGE
     ========================================================= */

  async function uploadImage(file) {

    if (!file) {
      return "";
    }

    const extension =
      file.name.split(".").pop().toLowerCase();

    const fileName =
      Date.now() +
      "-" +
      Math.random().toString(36).substring(2) +
      "." +
      extension;

    const filePath = "products/" + fileName;


    const { error: uploadError } =
      await db.storage
        .from("products")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });


    if (uploadError) {
      throw uploadError;
    }


    const {
      data: publicData
    } = db.storage
      .from("products")
      .getPublicUrl(filePath);


    return publicData.publicUrl;
  }


  /* =========================================================
     ADD / UPDATE PRODUCT
     ========================================================= */

  saveProductBtn.addEventListener(
    "click",
    saveProduct
  );


  async function saveProduct() {

    clearMessage(productMessage);

    const id = productId.value.trim();

    const name = productName.value.trim();
    const description =
      productDescription.value.trim();

    const price =
      Number(productPrice.value);

    const stock =
      Number(productStock.value);

    const imageFile =
      productImage.files[0];


    if (!name) {
      showMessage(
        productMessage,
        "Please enter product name.",
        "error"
      );
      return;
    }

    if (
      productPrice.value === "" ||
      Number.isNaN(price) ||
      price < 0
    ) {
      showMessage(
        productMessage,
        "Please enter a valid price.",
        "error"
      );
      return;
    }

    if (
      productStock.value === "" ||
      Number.isNaN(stock) ||
      stock < 0
    ) {
      showMessage(
        productMessage,
        "Please enter a valid stock quantity.",
        "error"
      );
      return;
    }


    saveProductBtn.disabled = true;
    saveProductBtn.textContent =
      id ? "UPDATING..." : "ADDING...";


    try {

      let imageUrl = "";


      /* Upload new image if selected */

      if (imageFile) {

        imageUrl =
          await uploadImage(imageFile);
      }


      /* UPDATE */

      if (id) {

        const updateData = {
          name: name,
          description: description,
          price: price,
          stock: stock
        };

        if (imageUrl) {
          updateData.image_url = imageUrl;
        }


        const {
          error
        } = await db
          .from("products")
          .update(updateData)
          .eq("id", id);


        if (error) {
          throw error;
        }


        showMessage(
          productMessage,
          "Product updated successfully.",
          "success"
        );

      }


      /* ADD */

      else {

        const {
          error
        } = await db
          .from("products")
          .insert({
            name: name,
            description: description,
            price: price,
            stock: stock,
            image_url: imageUrl
          });


        if (error) {
          throw error;
        }


        showMessage(
          productMessage,
          "Product added successfully.",
          "success"
        );
      }


      resetForm();
      await loadProducts();

    } catch (error) {

      console.error(error);

      showMessage(
        productMessage,
        error.message ||
        "Could not save product.",
        "error"
      );

    } finally {

      saveProductBtn.disabled = false;

      saveProductBtn.textContent =
        productId.value
          ? "UPDATE PRODUCT"
          : "ADD PRODUCT";
    }
  }


  /* =========================================================
     LOAD PRODUCTS
     ========================================================= */

  refreshBtn.addEventListener(
    "click",
    loadProducts
  );


  async function loadProducts() {

    productsList.innerHTML =
      '<div class="loading">Loading products...</div>';


    try {

      const {
        data,
        error
      } = await db
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      if (error) {
        throw error;
      }


      if (!data || data.length === 0) {

        productsList.innerHTML =
          '<div class="empty">No products added yet.</div>';

        return;
      }


      productsList.innerHTML = "";


      data.forEach(function(product) {

        const card =
          document.createElement("div");

        card.className = "product";


        const image =
          document.createElement("img");

        image.src =
          product.image_url ||
          "";

        image.alt =
          product.name || "Product";

        if (!product.image_url) {
          image.style.display = "none";
        }


        const info =
          document.createElement("div");

        info.className = "product-info";


        const title =
          document.createElement("h3");

        title.textContent =
          product.name;


        const desc =
          document.createElement("p");

        desc.textContent =
          product.description || "";


        const price =
          document.createElement("p");

        price.className = "price";

        price.textContent =
          "PKR " +
          Number(product.price)
            .toLocaleString("en-PK");


        const stock =
          document.createElement("p");

        stock.className = "stock";

        stock.textContent =
          "Stock: " +
          product.stock;


        const actions =
          document.createElement("div");

        actions.className = "actions";


        const editBtn =
          document.createElement("button");

        editBtn.className = "edit";

        editBtn.textContent = "EDIT";

        editBtn.addEventListener(
          "click",
          function() {
            editProduct(product);
          }
        );


        const deleteBtn =
          document.createElement("button");

        deleteBtn.className = "delete";

        deleteBtn.textContent = "DELETE";

        deleteBtn.addEventListener(
          "click",
          function() {
            deleteProduct(product);
          }
        );


        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);


        info.appendChild(title);
        info.appendChild(desc);
        info.appendChild(price);
        info.appendChild(stock);
        info.appendChild(actions);


        card.appendChild(image);
        card.appendChild(info);

        productsList.appendChild(card);
      });


    } catch (error) {

      console.error(error);

      productsList.innerHTML =
        '<div class="empty">Could not load products.</div>';
    }
  }


  /* =========================================================
     EDIT PRODUCT
     ========================================================= */

  function editProduct(product) {

    productId.value =
      product.id;

    productName.value =
      product.name || "";

    productDescription.value =
      product.description || "";

    productPrice.value =
      product.price ?? "";

    productStock.value =
      product.stock ?? "";


    if (product.image_url) {

      imagePreview.src =
        product.image_url;

      imagePreview.style.display =
        "block";

    } else {

      imagePreview.src = "";
      imagePreview.style.display =
        "none";
    }


    formTitle.textContent =
      "EDIT PRODUCT";

    saveProductBtn.textContent =
      "UPDATE PRODUCT";

    cancelEditBtn.classList.remove(
      "hidden"
    );


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  /* =========================================================
     DELETE PRODUCT
     ========================================================= */

  async function deleteProduct(product) {

    const confirmed =
      confirm(
        "Delete '" +
        product.name +
        "' permanently?"
      );

    if (!confirmed) {
      return;
    }


    try {

      const {
        error
      } = await db
        .from("products")
        .delete()
        .eq("id", product.id);


      if (error) {
        throw error;
      }


      await loadProducts();


    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Could not delete product."
      );
    }
  }


  /* =========================================================
     RESET FORM
     ========================================================= */

  cancelEditBtn.addEventListener(
    "click",
    resetForm
  );


  function resetForm() {

    productId.value = "";

    productName.value = "";

    productDescription.value = "";

    productPrice.value = "";

    productStock.value = "";

    productImage.value = "";

    imagePreview.src = "";

    imagePreview.style.display =
      "none";

    formTitle.textContent =
      "ADD PRODUCT";

    saveProductBtn.textContent =
      "ADD PRODUCT";

    cancelEditBtn.classList.add(
      "hidden"
    );
  }


  /* =========================================================
     START
     ========================================================= */

  checkSession();

</script>

</body>
</html>
